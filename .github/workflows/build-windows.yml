name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          & cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -Wno-dev *>&1 |
            Tee-Object -FilePath configure-output.log |
            Out-Null
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Host "=== Configure error summary ==="
            Get-Content configure-output.log -Tail 80
            exit $exitCode
          }
          Get-Content configure-output.log -Tail 10

      - name: Build
        shell: pwsh
        run: |
          & cmake --build build --config Release --parallel *>&1 |
            Tee-Object -FilePath build-output.log |
            Out-Null
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Host "=== Build error summary ==="
            Get-Content build-output.log -Tail 80
            exit $exitCode
          }
          Get-Content build-output.log -Tail 20

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/BlenderUIDemo.exe package/
          if (Test-Path build/SDL3.dll) { Copy-Item build/SDL3.dll package/ }
          Copy-Item README.md package/
          Copy-Item LICENSE package/
          Compress-Archive -Path package/* -DestinationPath BlenderUIDemo-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlenderUIDemo-windows-x64
          path: BlenderUIDemo-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
