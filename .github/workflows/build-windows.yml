name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          cmd /d /s /c "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -Wno-dev > configure-output.log 2>&1"
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Host "=== Configure error summary ==="
            Get-Content configure-output.log -Tail 80
            exit $exitCode
          }
          Get-Content configure-output.log -Tail 10

      - name: Build
        id: compile
        shell: pwsh
        run: |
          cmd /d /s /c "cmake --build build --config Release --parallel > build-output.log 2>&1"
          $exitCode = $LASTEXITCODE
          "exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          if ($exitCode -ne 0) {
            Get-Content build-output.log -Tail 80 | Set-Content build-error.txt
            Write-Host "Build failed; a concise diagnostic will be posted to the pull request."
          } else {
            Get-Content build-output.log -Tail 20
          }

      - name: Report compiler error
        if: steps.compile.outputs.exit_code != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- blender-ui-demo-build-error -->';
            const details = fs.readFileSync('build-error.txt', 'utf8').replaceAll('```', '` ` `');
            const body = `${marker}\n### Windows 构建错误摘要\n\n\`\`\`text\n${details}\n\`\`\``;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

      - name: Fail on compiler error
        if: steps.compile.outputs.exit_code != '0'
        shell: pwsh
        run: exit 1

      - name: Package
        if: steps.compile.outputs.exit_code == '0'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/BlenderUIDemo.exe package/
          if (Test-Path build/SDL3.dll) { Copy-Item build/SDL3.dll package/ }
          Copy-Item README.md package/
          Copy-Item LICENSE package/
          Compress-Archive -Path package/* -DestinationPath BlenderUIDemo-windows-x64.zip -Force

      - name: Upload artifact
        if: steps.compile.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: BlenderUIDemo-windows-x64
          path: BlenderUIDemo-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
