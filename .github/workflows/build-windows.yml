name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          $env:CC = 'cl'
          $env:CXX = 'cl'
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -Wno-dev

          $cache = Get-Content build/CMakeCache.txt -Raw
          if ($cache -notmatch 'CMAKE_CXX_COMPILER:FILEPATH=.*cl\.exe') {
            Write-Error 'The Windows build did not select the MSVC compiler.'
            exit 1
          }

      - name: Build
        id: compile
        shell: pwsh
        run: |
          $process = Start-Process -FilePath cmake `
            -ArgumentList @('--build', 'build', '--config', 'Release', '--parallel') `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput build-output.log `
            -RedirectStandardError build-stderr.log
          $exitCode = $process.ExitCode
          "exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          if ($exitCode -ne 0) {
            $diagnostic = @()
            if (Test-Path build-output.log) { $diagnostic += Get-Content build-output.log -Tail 50 }
            if (Test-Path build-stderr.log) { $diagnostic += Get-Content build-stderr.log -Tail 50 }
            $diagnostic | Set-Content build-error.txt
            Write-Host "Build failed; a concise diagnostic will be posted to the pull request."
          } else {
            Get-Content build-output.log -Tail 20
          }

      - name: Report compiler error
        if: steps.compile.outputs.exit_code != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- blender-ui-demo-build-error -->';
            const details = fs.readFileSync('build-error.txt', 'utf8').replaceAll('```', '` ` `');
            const body = `${marker}\n### Windows 构建错误摘要\n\n\`\`\`text\n${details}\n\`\`\``;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

      - name: Fail on compiler error
        if: steps.compile.outputs.exit_code != '0'
        shell: pwsh
        run: exit 1

      - name: Verify runtime dependencies
        if: steps.compile.outputs.exit_code == '0'
        shell: pwsh
        run: |
          $targets = @('build/BlenderUIDemo.exe', 'build/SDL3.dll')
          $forbidden = @(
            'libgcc_s_seh-1.dll',
            'libstdc++-6.dll',
            'libwinpthread-1.dll',
            'VCRUNTIME140.dll',
            'VCRUNTIME140_1.dll',
            'MSVCP140.dll'
          )

          foreach ($target in $targets) {
            if (-not (Test-Path $target)) {
              Write-Error "Missing build output: $target"
              exit 1
            }
            $dependencies = (& dumpbin /dependents $target | Out-String)
            Write-Host "=== Dependencies: $target ==="
            Write-Host $dependencies
            foreach ($library in $forbidden) {
              if ($dependencies -match [regex]::Escape($library)) {
                Write-Error "$target unexpectedly depends on $library"
                exit 1
              }
            }
          }

      - name: Package
        if: steps.compile.outputs.exit_code == '0'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/BlenderUIDemo.exe package/
          Copy-Item build/SDL3.dll package/
          Copy-Item README.md package/
          Copy-Item LICENSE package/

      - name: Upload artifact
        if: steps.compile.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: BlenderUIDemo-windows-x64
          path: package/
          if-no-files-found: error
          retention-days: 14
